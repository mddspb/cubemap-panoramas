name: Build cubemap panoramas

on:
  push:
    paths:
      - "sources.json"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Repository root:"
          ls -la
          echo "Scripts:"
          ls -la scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless py360convert

      - name: Debug Python environment
        run: |
          python --version
          python - <<EOF
          import cv2
          import py360convert
          print("OpenCV:", cv2.__version__)
          print("py360convert OK")
          EOF

      - name: Run panorama build
        run: |
          python scripts/build_panoramas.py

      - name: Show result folders
        run: |
          ls -la
