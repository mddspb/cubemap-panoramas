<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cubemap Panoramas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    h1, h2 {
      line-height: 1.3;
    }
    .panorama {
      margin-bottom: 2rem;
    }
    .meta {
      color: #555;
      font-size: 0.95em;
    }
    code {
      background: #f3f3f3;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<h1>Cubemap Panoramas</h1>

<p>
We are grateful to the authors and platforms that provide high-quality HDR panoramas
as open resources for the community.
</p>

<div id="list">Loading…</div>

<script>
fetch('./sources.json')
  .then(r => r.json())
  .then(data => {
    const root = document.getElementById('list');
    root.innerHTML = '';

    data.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'panorama';

      div.innerHTML = `
        <h2>Panorama ${i + 1}</h2>
        <div class="meta">
          <strong>Author:</strong> ${item.author || 'Unknown'}<br>
          <strong>Source:</strong> ${item.source || '—'}<br>
          <strong>License:</strong> ${item.license || '—'}<br>
          ${item.homepage ? `<strong>Homepage:</strong> <a href="${item.homepage}" target="_blank">${item.homepage}</a><br>` : ''}
        </div>
        <p>
          <strong>CDN base:</strong><br>
          <code>https://cdn.jsdelivr.net/gh/&lt;username&gt;/cubemap-panoramas/&lt;panorama-id&gt;/</code>
        </p>
      `;

      root.appendChild(div);
    });
  })
  .catch(err => {
    document.getElementById('list').textContent =
      'Failed to load sources.json';
    console.error(err);
  });
</script>

</body>
</html>
